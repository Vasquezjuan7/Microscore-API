name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  calidad:
    name: Lint, build y pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Pruebas unitarias
        run: npm test

      - name: Pruebas e2e
        run: npm run test:e2e

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -t microscore-api:ci .

      - name: Probar contenedor
        run: |
          docker run -d --name api -p 3000:3000 microscore-api:ci
          for i in $(seq 1 30); do curl -sf localhost:3000/v1/health && exit 0; sleep 1; done
          docker logs api
          exit 1
