services:
  api:
    build: .
    image: microscore-api:latest
    container_name: microscore-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DB_PATH: /app/data/microscore.sqlite
      DB_SYNCHRONIZE: "true"
    volumes:
      - microscore-data:/app/data

volumes:
  microscore-data:
